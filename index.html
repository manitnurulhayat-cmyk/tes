<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pencarian Jamaah</title>

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>

<style>
/* (CSS kamu biarkan saja, tidak perlu diubah) */
</style>

</head>

<body>

<div class="container">

<div class="header">

<img src="haji.png" class="logo">

<form id="searchForm">

<input type="text" id="nama" placeholder="Masukkan Nama Jamaah">

<select id="romb" class="select2">
<option value="">Pilih Rombongan</option>
</select>

<select id="regu" class="select2">
<option value="">Pilih Regu</option>
</select>

<button type="submit">Cari</button>

</form>

</div>

<div class="content">

<div id="loading" style="display:none;text-align:center;">
<div class="spinner"></div>
<p><strong>Memuat data...</strong></p>
</div>

<div id="result"></div>

</div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
const api_url = "https://script.google.com/macros/s/AKfycbx9PzQ3HVEANWbxR27EdpgJKHJ618EdEWKzC2EbeHTk0wJH5C9lcoJkGtTrvYEpokwR/exec";

// isi dropdown
for(let i=1;i<=8;i++){
    $('#romb').append(`<option value="ROMB. ${i}">ROMB. ${i}</option>`);
}
for(let i=1;i<=4;i++){
    $('#regu').append(`<option value="REGU ${i}">REGU ${i}</option>`);
}

$('.select2').select2({
    width:'100%',
    dropdownParent:$('.header')
});

document.getElementById('searchForm').addEventListener('submit', async function(e){
    e.preventDefault();

    document.getElementById('loading').style.display='block';
    document.getElementById('result').innerHTML='';

    const nama = document.getElementById('nama').value;
    const romb = document.getElementById('romb').value;
    const regu = document.getElementById('regu').value;

    try {
        const res = await fetch(api_url);
        const data = await res.json();

        const filtered = data.filter(row => {
            return (!nama || row.NAMA.toLowerCase().includes(nama.toLowerCase())) &&
                   (!romb || row.ROMBONGAN === romb) &&
                   (!regu || row.REGU === regu);
        });

        renderTable(filtered);

    } catch(err){
        document.getElementById('result').innerHTML = "<div class='message'>Gagal ambil data</div>";
    }

    document.getElementById('loading').style.display='none';
});

function renderTable(data){
    if(data.length === 0){
        document.getElementById('result').innerHTML = "<div class='message'>Tidak ada data ditemukan</div>";
        return;
    }

    let html = `<div class="table-wrap"><table>
    <thead>
    <tr>
    <th>NAMA</th><th>ROMBONGAN</th><th>REGU</th><th>NO PASPOR</th><th>PORSI</th>
    </tr>
    </thead><tbody>`;

    data.forEach(row => {
        let hp = (row.HP || '').split('|')[0].trim();

        let phone = hp.startsWith('08') ? '62'+hp.slice(1) :
                    hp.startsWith('8') ? '62'+hp : hp;

        let wa = "https://api.whatsapp.com/send/?phone=" + phone;

        html += `
        <tr>
        <td><a href="${wa}" target="_blank">${row.NAMA}</a></td>
        <td>${row.ROMBONGAN}</td>
        <td>${row.REGU}</td>
        <td>${row.NO_PASPOR}</td>
        <td>${row.PORSI}</td>
        </tr>`;
    });

    html += "</tbody></table></div>";

    document.getElementById('result').innerHTML = html;
}
</script>

</body>
</html>
